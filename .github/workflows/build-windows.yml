name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "pyinstaller==6.11.1"
          pip install -r public/downloads/requirements.txt
          pip install pywin32-ctypes
          python -c "import winocr; print('winocr OK')"
          python -c "import winrt.windows.foundation.collections; print('winrt foundation collections OK')"
          python -c "import winrt.windows.media.ocr; print('winrt media OCR OK')"
          python -c "import mss, PIL; print('OCR capture deps OK')"

      - name: Inject build constants
        shell: pwsh
        env:
          API_URL: ${{ secrets.API_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: |
          $src = "public/downloads/wim_bridge_gui.py"
          $content = [System.IO.File]::ReadAllText((Resolve-Path $src), [System.Text.Encoding]::UTF8)
          if ($env:API_URL) {
            $content = $content -replace 'API_URL = "https://[^"]*"', ('API_URL = "' + $env:API_URL + '"')
            Write-Host "✓ API_URL injected"
          }
          if ($env:BRIDGE_TOKEN) {
            $content = $content -replace 'BRIDGE_TOKEN = "REPLACE_WITH_YOUR_TOKEN"', ('BRIDGE_TOKEN = "' + $env:BRIDGE_TOKEN + '"')
            Write-Host "✓ BRIDGE_TOKEN injected"
          }
          [System.IO.File]::WriteAllText((Resolve-Path $src), $content, [System.Text.UTF8Encoding]::new($false))

      - name: Sanity check source
        shell: pwsh
        run: |
          python -c "import ast; ast.parse(open('public/downloads/wim_bridge_gui.py', encoding='utf-8').read()); print('Python syntax OK')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $pyargs = @(
            "--onefile", "--noconsole", "--name", "WhisperRelay",
            "--collect-submodules", "pyautogui",
            "--collect-submodules", "pydirectinput",
            "--collect-submodules", "psutil",
            "--collect-all", "winocr",
            "--collect-submodules", "winrt",
            "--hidden-import", "winocr",
            "--hidden-import", "winrt.windows.foundation",
            "--hidden-import", "winrt.windows.foundation.collections",
            "--hidden-import", "winrt.windows.globalization",
            "--hidden-import", "winrt.windows.graphics.imaging",
            "--hidden-import", "winrt.windows.media.ocr",
            "--hidden-import", "winrt.windows.storage.streams",
            "--hidden-import", "mss",
            "--hidden-import", "PIL.Image",
            "--hidden-import", "win32gui",
            "--hidden-import", "win32con",
            "--hidden-import", "win32api",
            "--hidden-import", "win32process",
            "--hidden-import", "pywintypes",
            "--hidden-import", "speech_recognition",
            "--hidden-import", "pyaudio",
            "--hidden-import", "soundcard",
            "--hidden-import", "numpy",
            "public/downloads/wim_bridge_gui.py"
          )
          pyinstaller @pyargs

      - name: Verify OCR imports in build env
        shell: pwsh
        run: |
          if (!(Test-Path dist/WhisperRelay.exe)) { throw "Executable not found" }
          Write-Host "✅ Build successful: dist/WhisperRelay.exe"
          Get-Item dist/WhisperRelay.exe | Format-List FullName,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperRelay-Windows
          path: dist/WhisperRelay.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WhisperRelay.exe
          name: Bakers Whisper ${{ github.ref_name }}
          body: |
            Build com OCR principal corrigido: winocr + PyWinRT empacotados no .exe.
          draft: false
          prerelease: false
