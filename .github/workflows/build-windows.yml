name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # permite disparar manualmente pela aba Actions

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install requests pydirectinput pyautogui pywin32 psutil

      - name: Inject build constants
        shell: pwsh
        env:
          API_URL: ${{ secrets.API_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: |
          $src = "public/downloads/wim_bridge_gui.py"
          $content = Get-Content $src -Raw
          if ($env:API_URL) {
            $content = $content -replace 'API_URL = "https://wimmsg-lntm\.vercel\.app"', "API_URL = `"$env:API_URL`""
          }
          if ($env:BRIDGE_TOKEN) {
            $content = $content -replace 'BRIDGE_TOKEN = "REPLACE_WITH_YOUR_TOKEN"', "BRIDGE_TOKEN = `"$env:BRIDGE_TOKEN`""
          }
          Set-Content $src $content
          Write-Host "API_URL and BRIDGE_TOKEN injected."

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "BakersWhisper" public/downloads/wim_bridge_gui.py

      - name: Verify build
        run: |
          if (Test-Path dist/BakersWhisper.exe) {
            Write-Host "Build successful: dist/BakersWhisper.exe"
            Get-Item dist/BakersWhisper.exe | Select-Object Name, Length
          } else {
            Write-Error "Build failed - executable not found"
            exit 1
          }

      - name: Upload artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: BakersWhisper-Windows
          path: dist/BakersWhisper.exe
          retention-days: 30

      - name: Create Release (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BakersWhisper.exe
          name: Bakers Whisper ${{ github.ref_name }}
          body: |
            ## 🥐 Bakers Whisper ${{ github.ref_name }}

            ### 📥 Download
            Baixe o arquivo **BakersWhisper.exe** abaixo.

            ### 🚀 Como usar
            1. Baixe e execute `BakersWhisper.exe` (Windows pode pedir permissão — clique em "Mais informações → Executar assim mesmo")
            2. Abra o WoW em cada janela que quiser monitorar
            3. Dentro do jogo, digite `/chatlog` em cada janela
            4. No app, digite o nome do personagem ao lado de cada janela detectada
            5. Clique em ▶ Iniciar

            Pronto! Todos os whispers vão aparecer no painel web.
          draft: false
          prerelease: false
