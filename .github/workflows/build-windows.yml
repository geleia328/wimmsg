name: Build Windows Executable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: pip install pyinstaller==6.11.1 requests pydirectinput pyautogui pywin32 psutil Pillow pywin32-ctypes SpeechRecognition winocr
      - name: Sanity imports
        run: python -c "import win32gui, win32con, win32api, win32process, psutil, requests"
      - name: Inject build constants
        shell: pwsh
        env:
          API_URL: ${{ secrets.API_URL }}
          BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
        run: |
          $p = 'public/downloads/wim_bridge_gui.py'
          $c = [IO.File]::ReadAllText($p)
          if ($env:API_URL) { $c = $c -replace 'API_URL="https://[^"]*"', ('API_URL="' + $env:API_URL + '"') }
          if ($env:BRIDGE_TOKEN) { $c = $c.Replace('BRIDGE_TOKEN="COLE_SEU_TOKEN_AQUI"', 'BRIDGE_TOKEN="' + $env:BRIDGE_TOKEN + '"') }
          [IO.File]::WriteAllText($p, $c, (New-Object Text.UTF8Encoding($false)))
      - name: Parse Python
        run: python -c "import ast,pathlib;ast.parse(pathlib.Path('public/downloads/wim_bridge_gui.py').read_text(encoding='utf-8'))"
      - name: Build executable
        run: pyinstaller --onefile --noconsole --name BakersWhisper --collect-submodules pyautogui --collect-submodules pydirectinput --collect-submodules psutil --hidden-import win32gui --hidden-import win32con --hidden-import win32api --hidden-import win32process --hidden-import pywintypes --hidden-import pkg_resources.py2_warn public/downloads/wim_bridge_gui.py
      - name: Verify executable
        shell: pwsh
        run: if (!(Test-Path 'dist/BakersWhisper.exe')) { throw 'Executable missing' }; Get-Item dist/BakersWhisper.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BakersWhisper-Windows
          path: dist/BakersWhisper.exe
          retention-days: 30
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/BakersWhisper.exe
          name: Bakers Whisper ${{ github.ref_name }}
          body: Baixe BakersWhisper.exe, permita no SmartScreen, configure servidor e Personagem-Reino e clique Iniciar.
