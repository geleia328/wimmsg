[server]
# URL base do site Bakers Whisper (produção ou dev)
base_url = http://127.0.0.1:3000
# token compartilhado com o site; deixe vazio em dev local
bridge_token =

[bridge]
# caminho para WoWChatLog.txt (será autodetectado se em branco)
chatlog_path =
# intervalo de poll da fila em ms (default 1500)
queue_poll_ms = 1500
# intervalo de scan de janelas em ms
scan_ms = 3000

[send]
focus_delay_ms = 2000
chat_open_delay_ms = 1000
keystroke_delay_ms = 100
chat_send_delay_ms = 1000
after_send_delay_ms = 1000
close_chat_enabled = yes
chat_close_delay_ms = 500

[stt]
# Leitura via text-to-speech do addon + speech-to-text local (bypass do WoWChatLog).
# Requer: pip install -r requirements-stt.txt
enabled = no
# Modelo Whisper: tiny.en | tiny | small.en | small | medium.en | medium
model = small
# cpu ou cuda
device = cpu
# int8 | int8_float16 | float16 | float32
compute_type = int8
# Idioma da fala do addon (mantenha en; o addon soletra em inglês).
language = en
# Filtro parcial do nome do speaker/loopback (vazio = default do Windows).
device_name =
# Se souber o personagem que a placa de som está falando, fixe aqui;
# vazio deixa o bridge adivinhar pelo foreground.
own_character =
# Sensibilidade de voice-activity-detection.
rms_threshold = 0.008
silence_ms = 700
max_utter_ms = 12000
