[bridge]
# URL do site (Next.js) que exibe as conversas.
#   local:  http://localhost:3000
#   Vercel: https://bakers-whisper.vercel.app  (ou seu domínio)
api_url = http://localhost:3000

# Token compartilhado — DEVE bater com BRIDGE_TOKEN configurado no site.
# Obrigatório em produção. Em dev pode deixar vazio dos dois lados.
token =

# Intervalo de polling na fila de saída (segundos).
poll_interval = 1.0

# Delay entre teclas pressionadas ao enviar mensagens (segundos).
type_delay = 0.02

# Se true, tenta focar automaticamente a janela do WoW antes de enviar.
# Se false, você mesmo precisa ter o WoW em foco.
auto_focus = true

# ---------------------------------------------------------------------------
# Personagens (janelas do WoW)
# ---------------------------------------------------------------------------
# Um bloco [character:Nome-Reino] por janela aberta. Cada uma indica:
#   chat_log     — caminho para o WoWChatLog.txt daquela instalação (ative
#                  com /chatlog no jogo). Se você usa uma instalação só e
#                  todas as janelas compartilham o mesmo log, aponte todas
#                  para o mesmo arquivo — o addon WIMBridge inclui o campo
#                  <OWN:Nome-Reino> em cada linha para desambiguar.
#   window_title — trecho do TÍTULO da janela do WoW (para focar antes de
#                  digitar). Você pode renomear os títulos com um utilitário
#                  simples ou usar o executável em pastas separadas. Cada
#                  título precisa ser único.
#
# EXEMPLOS (edite/duplique conforme necessário):

[character:Aragorn-Nemesis]
chat_log = C:\Games\WoW-Inst1\_retail_\Logs\WoWChatLog.txt
window_title = WoW - Aragorn

[character:Legolas-Nemesis]
chat_log = C:\Games\WoW-Inst2\_retail_\Logs\WoWChatLog.txt
window_title = WoW - Legolas

[character:Gimli-Nemesis]
chat_log = C:\Games\WoW-Inst3\_retail_\Logs\WoWChatLog.txt
window_title = WoW - Gimli

# ... adicione até quantas janelas quiser (o bridge escala tranquilo).
