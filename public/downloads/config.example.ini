[bridge]
# URL do painel Bakers Whisper.
#   local:  http://localhost:3000
#   Vercel: https://seu-app.vercel.app
api_url = http://localhost:3000

# Token compartilhado — precisa bater com BRIDGE_TOKEN no .env do site.
# Em produção isso é obrigatório. Em dev pode ficar vazio.
token =

# Intervalo de polling na fila de saída (segundos).
poll_interval = 1.0

# ---------------------------------------------------------------------------
# Personagens (uma janela do WoW cada).
#
#   window_title  — trecho do TÍTULO da janela do WoW. O bridge procura
#                   esse texto entre todas as janelas abertas para focar
#                   a correta antes de digitar. Use títulos únicos.
#   ocr_top       — quantos px a faixa preta está do topo da janela.
#                   Padrão 0 (o addon põe a faixa colada no topo).
#   ocr_height    — altura em px do recorte que vai para o OCR.
#                   Mantenha entre 80 e 260.
# ---------------------------------------------------------------------------

[character:bakerz-area52]
window_title = WoW - bakerz
ocr_top = 0
ocr_height = 160

[character:aemond-azralon]
window_title = WoW - aemond
ocr_top = 0
ocr_height = 160

[character:fataburns-illidan]
window_title = WoW - fataburns
ocr_top = 0
ocr_height = 160
